<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="My Day, My Way — a gentle daily contribution tracker: areas of your life, a day timesheet, money, energy and notes. Bilingual (EN/RU).">
<meta name="theme-color" content="#FCF6F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#20161D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<title>My Day, My Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap">
<script>
  // Apply the remembered theme before first paint so the page never flashes
  // the wrong palette while the app bundle loads.
  try{var t=localStorage.getItem("tracker_theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
